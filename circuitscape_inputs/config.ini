[Calculation options]
low_memory_mode = False
solver = cholmod
print_timings = False

[Output options]
write_cum_cur_map_only = True
log_transform_maps = False
output_file = circuitscape_inputs/circuitscape.out
write_max_cur_maps = False
write_volt_maps = False
set_null_currents_to_nodata = True
set_null_voltages_to_nodata = True
compress_grids = False
write_cur_maps = False

[Connection scheme for raster habitat data]
connect_four_neighbors_only = True
connect_using_avg_resistances = True

[Habitat raster or graph]
habitat_file = circuitscape_inputs/resistance.asc
habitat_map_is_resistances = True

[Options for one-to-all and all-to-one modes]
use_variable_source_strengths = False
variable_source_file = None

[Mask file]
use_mask = False
mask_file = None

[Focal node location(s)]
point_file = circuitscape_inputs/patches.asc

[Circuitscape mode]
data_type = raster
scenario = pairwise
